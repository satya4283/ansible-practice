- name: ansible facts
  hosts: local
  connection: local
  tasks:
    - name: printing ansible facts
      debug:
        msg: "{{ ansible_facts }}"
    
    - name: print os_family of targetting machine 
      debug:
        msg: |
         os-family: "{{ansible_facts.os_family}}"
         private_ip: "{{ansible_facts.default_ipv4.address}}"
         private_ip: "{{ansible_facts['default_ipv4']['address']}}"

      