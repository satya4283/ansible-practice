- name: course information
  hosts: local
  connection: local
  vars:
    course: AIOPS with Devsecops using AWS
    duration_in_hours: 10
    is_live_session: true
    topics:
      - linux
      - shell script
      - ansible 
      - Terraform
    more_details:
      trainer: siva
      months: 4
    exact_duration_months: 5.5
  
  tasks:
    - name: print course details
      debug:
        msg: |
          course: {{course}}: {{course | type_debug }}
          duration: {{duration_in_hours}} : {{ duration_in_hours | type_debug }}
          live: {{is_live_session}} : {{ is_live_session | type_debug }}
          topics: {{ topics }}: {{ topics | type_debug}}
          more details: {{ more_details }}: {{ more_details | type_debug}}
          exact_duration: {{exact_duration_months}}: {{exact_duration_months | type_debug}}
