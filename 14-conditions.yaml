- name: demo on conditions 
  hosts: local
  connection: local
  vars:
    given_number: 11

  tasks:
    - name: is even
      debug:
        msg: "Given number {{ given_number}} is even"
      when: given_number % 2 == 0

    - name: is odd
      debug:
        msg: "Given number {{ given_number}} is odd"
      when: given_number % 2 != 0