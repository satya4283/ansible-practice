- name: check user exists or not 
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: check roboshop user
      command: id roboshop
      register: user_output
      ignore_errors: true

    - name: print user user_output
      debug:
        msg: "{{user_output}}"

    - name: add roboshop user if not present 
      command: useradd roboshop
      when: user_output.rc != 0 